// JK_Shinobi: only the saber_dps measurement (JK_Shinobi_SaberDps.bat): every blade and stance
// swings at a still target for 4 s; the table goes to shinobi_autotest.txt and the game quits.
set com_maxfps 60
set g_gametype 0
set bot_minplayers 0
set fraglimit 0
set timelimit 0
set g_teamAutoJoin 0
set shinobi_noForceMenu 1
set shinobi_hitnumbers 1
set shinobi_autotest_done "set g_teamAutoJoin 0; set shinobi_noForceMenu 0; wait 30; condump shinobi_condump.txt; wait 10; quit"
devmap mp/ffa3
wait 600
team spectator
wait 60
shinobi_autotest saber_dps
wait 600
follow TestA
