// JK_Shinobi: the blade tests only (JK_Shinobi_SaberDps.bat): saber_dps - every blade
// swings at a still target; blade_combo - every finisher. Results in shinobi_autotest.txt, then it quits.
set com_maxfps 60
set g_gametype 0
set bot_minplayers 0
set fraglimit 0
set timelimit 0
set g_teamAutoJoin 0
set shinobi_noForceMenu 1
set shinobi_hitnumbers 1
set shinobi_autotest_done "set g_teamAutoJoin 0; set shinobi_noForceMenu 0; wait 30; condump shinobi_condump.txt; wait 10; quit"
devmap mp/ffa3
wait 600
team spectator
wait 60
shinobi_autotest saber_dps blade_combo
wait 600
follow TestA
