// JK_Shinobi automatic self-test.
// Loads a map, casts every jutsu (several at level 3, the fireball through the
// real hold-to-charge path), takes screenshots (screenshots/st*.jpg), dumps
// the console to shinobi_condump.txt and quits.
// "wait N" waits N command-buffer passes; at com_maxfps 60 that is ~120 per second.
set com_maxfps 60
set shinobi_debug 1
set cg_thirdPerson 1
set cg_thirdPersonRange 110
set bot_minplayers 0
set g_gametype 0
set g_teamAutoJoin 1
set shinobi_noForceMenu 1
devmap mp/ffa3
wait 600
team free
wait 120
god
shinobi_diag
screenshot st00_spawn
+use
wait 120
screenshot st01_charging
wait 60
-use
wait 20
npc spawn shinobi_clone
wait 60
rasengan 3
wait 20
screenshot st02_rasengan_forming
wait 60
screenshot st03_rasengan_armed_lv3
+attack
wait 3
-attack
wait 8
screenshot st04_rasengan_dash
wait 60
+use
wait 300
-use
wait 20
npc spawn shinobi_clone
wait 60
chidori 3
wait 60
screenshot st05_chidori_armed_lv3
+attack
wait 3
-attack
wait 14
screenshot st06_chidori_dash_trail
wait 60
+use
wait 300
-use
wait 10
+katon
wait 100
screenshot st07_katon_charging_bars
wait 100
screenshot st08_katon_charging_lv3
-katon
wait 10
screenshot st09_fireball_lv3
wait 40
screenshot st10_fireball_far
wait 120
+use
wait 200
-use
wait 10
shunshin
wait 2
screenshot st11_shunshin
wait 60
doton 1
wait 15
screenshot st12_wall_rising
wait 60
screenshot st13_wall_lv1
wait 130
katon 3
wait 30
screenshot st14_wall_hit
+use
wait 250
-use
wait 10
katon 3
wait 40
screenshot st15_wall_half_broken
+use
wait 300
-use
wait 10
kagebunshin 3
wait 15
screenshot st16_clone_smoke
wait 60
screenshot st17_clone_smoke_late
wait 200
screenshot st18_clones
shinobi_diag
set g_teamAutoJoin 0
set shinobi_noForceMenu 0
set shinobi_debug 0
wait 30
condump shinobi_condump.txt
wait 10
quit
