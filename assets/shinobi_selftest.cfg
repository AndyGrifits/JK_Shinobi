// JK_Shinobi automatic self-test.
// Loads a map, casts every jutsu (several at level 3, the fireball through the
// real hold-to-charge path), takes screenshots (screenshots/st*.jpg), dumps
// the console to shinobi_condump.txt and quits.
// "wait N" waits N command-buffer passes; at com_maxfps 60 that is ~120 per second.
set com_maxfps 60
set shinobi_debug 1
set cg_thirdPerson 1
set cg_thirdPersonRange 110
set bot_minplayers 0
set g_gametype 0
set g_teamAutoJoin 1
set shinobi_noForceMenu 1
set shinobi_build suiton,mizubunshin,suiro,futon,windblade/2,2,2,2,2/none
devmap mp/ffa3
wait 600
team free
wait 120
