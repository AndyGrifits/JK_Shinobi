// JK_Shinobi automatic self-test.
// Loads a map, casts every jutsu, takes screenshots (screenshots/st*.jpg),
// dumps the console to shinobi_condump.txt and quits.
// "wait N" waits N command-buffer passes; at com_maxfps 60 that is ~120 per second.
set com_maxfps 60
set cg_thirdPerson 1
set cg_thirdPersonRange 110
set bot_minplayers 0
set g_gametype 0
set g_teamAutoJoin 1
set shinobi_noForceMenu 1
devmap mp/ffa3
wait 600
team free
wait 120
god
shinobi_diag
screenshot st00_spawn
wait 30
+use
wait 120
screenshot st01_charging
wait 120
-use
wait 30
screenshot st02_stood_up
npc spawn shinobi_clone
wait 60
rasengan
wait 30
screenshot st03_rasengan_forming
wait 80
screenshot st04_rasengan_armed
+attack
wait 3
-attack
wait 8
screenshot st05_rasengan_dash
wait 60
+use
wait 200
-use
wait 20
npc spawn shinobi_clone
wait 60
chidori
wait 20
screenshot st06_chidori_forming
wait 60
screenshot st07_chidori_armed
+attack
wait 3
-attack
wait 6
screenshot st08_chidori_dash
wait 60
+use
wait 120
-use
wait 10
katon
wait 12
screenshot st09_fireball
wait 150
screenshot st10_fireball_after
+use
wait 120
-use
wait 10
doton
wait 15
screenshot st11_wall_rising
wait 45
screenshot st12_wall
shunshin
wait 2
screenshot st13_shunshin
wait 60
+use
wait 180
-use
wait 10
kagebunshin
wait 10
screenshot st14_clones_spawn
wait 120
screenshot st15_clones
shinobi_diag
set g_teamAutoJoin 0
set shinobi_noForceMenu 0
wait 30
condump shinobi_condump.txt
wait 10
quit
