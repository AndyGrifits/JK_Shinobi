// JK_Shinobi: the combat2 test only (JK_Shinobi_Combat2Test.bat): every blade through the same
// clicks under combat 2's rules; results in shinobi_autotest.txt, then it quits.
set shinobi_combat2 1
set com_maxfps 60
set sv_maxclients 8
set g_gametype 0
set bot_minplayers 0
set fraglimit 0
set timelimit 0
set g_teamAutoJoin 0
set shinobi_noForceMenu 1
set shinobi_hitnumbers 1
set shinobi_autotest_done "set g_teamAutoJoin 0; set shinobi_noForceMenu 0; set shinobi_combat2 0; wait 30; condump shinobi_condump.txt; wait 10; quit"
devmap mp/ffa3
wait 600
team spectator
wait 60
shinobi_autotest combat2
wait 600
follow TestA
