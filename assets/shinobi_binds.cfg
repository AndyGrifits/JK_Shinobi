// JK_Shinobi default controls
// Pick a jutsu with Q / E, hold F to charge it (three bars), release to cast.
bind q "jutsu_prev"    // previous jutsu
bind e "jutsu_next"    // next jutsu
bind f "+jutsu"        // hold: charge the selected jutsu, release: cast
bind r "+use"          // hold while standing still: gather chakra (also opens doors)
bind x "kawarimi"      // substitution: a double takes your place, you vanish
bind z "kunai"         // throw a kunai; with an explosive kunai / tag / shuriken in hand: use it; Shift+Z: a marked kunai
bind y "kunai"         // the same key on a German (QWERTZ) layout - Windows switches layouts on Alt+Shift
bind j "messagemode"   // chat to everyone (was Y); T = team chat (everyone in free-for-all)
bind 2 "shinobi_melee" // fists <-> your weapon
bind b "shinobi_build_menu" // ninja build: techniques, stats, special
bind mouse2 "+button13" // hold: block (guard = shield bar; tap right before a hit = perfect parry); no saber throw in this mod
bind ctrl "+button13"  // (the old block key still works)
bind c "perk"          // special ability: Sharingan / Byakugan on-off, Inner Gates, Curse Seal on-off
bind alt "+movedown"   // crouch (C is the special ability now)
bind 3 "weapon 10"     // the stock explosives key: explosive kunai -> tag -> fuma shuriken (whatever you carry)
bind 4 "weapon 4"
bind 5 "weapon 5"
unbind [
unbind ]
// Shift is the chakra modifier (no more slow walk):
//   Shift + Space        Shunshin forward (hold Space longer = farther)
//   Shift + S + Space    Shunshin backward
//   Shift + attack       chakra in fists / blade (your main school's nature)
//   Shift + Z            marked kunai
bind shift "+speed"
set cl_run 1
// T and G are back to normal; V still raises an earth wall
bind t "messagemode2"  // back to the stock bind (team chat)
unbind g
unbind h
bind v "+doton"
set cg_thirdPerson 1
echo "^5JK_Shinobi:^7 ^3Q/E^7 pick jutsu, hold ^3F^7 cast | hold ^3R^7 chakra | ^3Shift+Space^7 Shunshin | ^3X^7 Kawarimi | ^3Z^7 kunai | ^32^7 fists/saber | ^3C^7 special | ^33^7/wheel tools, ^3Z^7 throw | ^3RMB^7 block | ^3B^7 build"

// the stock model memory budget (20 MB) is less than our two skeletons alone: over it the
// game throws models out at every map load, and the ones the server holds (bots' characters,
// their weapons) then fail to load ("RE_RegisterModel: unknown fileid") and stay invisible
seta r_modelpoolmegs 256
