// JK_Shinobi default controls
// Pick a jutsu with Q / E, hold F to charge it (three bars), release to cast.
bind q "jutsu_prev"    // previous jutsu
bind e "jutsu_next"    // next jutsu
bind f "+jutsu"        // hold: charge the selected jutsu, release: cast
bind r "+use"          // hold while standing still: gather chakra (also opens doors)
bind x "kawarimi"      // substitution: a double takes your place, you vanish
bind 2 "shinobi_melee" // fists <-> saber
// Shift is the chakra modifier (no more slow walk):
//   Shift + Space        Shunshin forward (hold Space longer = farther)
//   Shift + S + Space    Shunshin backward
bind shift "+speed"
set cl_run 1
// quick keys for single jutsu still work
bind t "+chidori"
bind v "+doton"
bind g "+kagebunshin"
set cg_thirdPerson 1
echo "^5JK_Shinobi:^7 ^3Q/E^7 pick jutsu, hold ^3F^7 cast | hold ^3R^7 chakra | ^3Shift+Space^7 Shunshin | ^3X^7 Kawarimi | ^32^7 fists/saber"
