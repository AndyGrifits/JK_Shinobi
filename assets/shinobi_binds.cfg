// JK_Shinobi default controls
// Jutsu keys are held: three bars fill up, release casts at the reached level.
bind e "+use"          // hold while standing still: gather chakra
bind r "+rasengan"     // Rasengan in hand, then attack to strike
bind t "+chidori"      // Chidori in hand, then attack to pierce
bind f "+katon"        // great fireball
bind v "+doton"        // earth wall
bind g "+kagebunshin"  // shadow clones (1-3) behind a smoke screen
bind q "shunshin"      // body flicker: short teleport where you look (15 chakra)
set cg_thirdPerson 1
echo "^5JK_Shinobi:^7 hold ^3E^7 chakra | hold ^3R^7 Rasengan ^3T^7 Chidori ^3F^7 fireball ^3V^7 wall ^3G^7 clones | ^3Q^7 Shunshin"
