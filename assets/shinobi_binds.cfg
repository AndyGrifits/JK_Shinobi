// JK_Shinobi default controls
bind e "+use"          // hold while standing still: gather chakra
bind r "rasengan"      // form a Rasengan (40 chakra), then press attack to strike
bind q "shunshin"      // body flicker: short teleport where you look (15 chakra)
bind g "kagebunshin"   // two shadow clones that fight for you (50 chakra)
bind t "chidori"       // lightning in hand (35 chakra), then attack to pierce
bind f "katon"         // great fireball (30 chakra)
bind v "doton"         // earth wall of stone pillars in front of you (30 chakra)
set cg_thirdPerson 1
echo "^5JK_Shinobi:^7 hold ^3E^7 to gather chakra, ^3R^7 = Rasengan, ^3T^7 = Chidori, ^3F^7 = fireball, ^3V^7 = earth wall, ^3Q^7 = Shunshin, ^3G^7 = clones"
