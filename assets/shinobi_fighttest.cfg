// JK_Shinobi: the fight rules tests (JK_Shinobi_FightTest.bat): guard and parry edge cases (the launcher on a guard, the push
// on a parry, the riposte), the guard costs, flinch, the air combo, the blade combo and its clicks, plain cuts landing.
// Results in shinobi_autotest.txt, then it quits.
set com_maxfps 60
set g_gametype 0
set bot_minplayers 0
set fraglimit 0
set timelimit 0
set g_teamAutoJoin 0
set shinobi_noForceMenu 1
set shinobi_hitnumbers 1
set shinobi_debug 1
set shinobi_autotest_done "set g_teamAutoJoin 0; set shinobi_noForceMenu 0; set shinobi_debug 0; wait 30; condump shinobi_condump.txt; wait 10; quit"
devmap mp/ffa3
wait 600
team spectator
wait 60
shinobi_autotest guard_edges parry guard_swing guard_break flinch air_combo blade_clicks blade_combo blade_reach
wait 600
follow TestA
