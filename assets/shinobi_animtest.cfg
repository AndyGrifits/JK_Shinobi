// JK_Shinobi: Kaiten poses side by side. "exec shinobi_animtest" from the main menu
// console: you spin a Kaiten with each candidate pose and a screenshot is taken
// (screenshots/ka_*.jpg). The pose you like goes into shinobi_kaitenAnim1 (wind-up)
// and shinobi_kaitenAnim2 (spinning).
set com_maxfps 60
set g_gametype 0
set bot_minplayers 0
set shinobi_noForceMenu 1
set cg_thirdPerson 1
set cg_thirdPersonRange 110
set cg_thirdPersonAngle 30
devmap mp/ffa3
wait 600
team free
wait 200
god
set shinobi_kaitenAnim1 BOTH_FORCE_RAGE
set shinobi_kaitenAnim2 BOTH_FORCE_RAGE
wait 10
chakra
jutsu_begin kaiten
wait 20
screenshot ka_windup_FORCE_RAGE
wait 70
screenshot ka_FORCE_RAGE
jutsu_release
wait 40
set shinobi_kaitenAnim2 BOTH_SABERSLOW_STANCE
chakra
jutsu_begin kaiten
wait 90
screenshot ka_SABERSLOW_STANCE
jutsu_release
wait 40
set shinobi_kaitenAnim2 BOTH_SABERFAST_STANCE
chakra
jutsu_begin kaiten
wait 90
screenshot ka_SABERFAST_STANCE
jutsu_release
wait 40
