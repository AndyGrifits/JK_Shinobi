// JK_Shinobi combat 2 controls (JK_Shinobi_Combat2.bat, on top of shinobi_binds.cfg; the plain
// launcher puts the usual ones back)
//   Shift          block (tap right before a hit: perfect parry)
//   LMB            light blow - 4 in a row, the 5th click is the push finisher
//   RMB            heavy blow - after the 3rd or 4th step: the heavy finisher
//                  (nothing held: up he goes, Space: Shunshin after him; W: shoved down;
//                  S: the sweep; A / D: the spin)
//   Shift + LMB    grab (fists) / the blade's special attack
//   Space in air   Shunshin where you look (S + Space: backward)
bind shift "+button13"
bind mouse2 "+button15"
set cl_run 1
echo "^5JK_Shinobi combat 2:^7 ^3Shift^7 block | ^3LMB^7 light (4, then the push) | ^3RMB^7 heavy (after 3-4: finisher by direction) | ^3Shift+LMB^7 grab / special | ^3Space^7 in the air: Shunshin"
