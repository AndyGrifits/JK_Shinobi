// JK_Shinobi: punching bags (JK_Shinobi_Dummy.bat) - the small Chunin arena and two bots that
// stand side by side in front of you doing nothing (no AI, bare hands) and come back on their
// feet in front of you after each death: "Dummy" (left) takes everything, "DummyGuard" (right)
// holds its guard up. More: addbot alora 1 free 0 Dummy2
set g_gametype 0
set bot_minplayers 0
set fraglimit 0
set timelimit 0
set g_teamAutoJoin 0
set shinobi_noForceMenu 0
set shinobi_hitnumbers 1
set shinobi_dummy 1
exec shinobi_camreset.cfg
map shinobi_chunin
wait 300
addbot alora 1 free 0 Dummy
wait 60
addbot alora 1 free 0 DummyGuard
