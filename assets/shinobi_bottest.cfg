// JK_Shinobi: the bot tactics tests only (JK_Shinobi_BotTest.bat): bot_escape (Kawarimi out of a Water Prison),
// bot_prison (its own prison held), bot_interrupt (seals broken), bot_dodge (fireballs), bot_keepoff (Kaiten),
// plus the older bot_defend / bot_fists. Results in shinobi_autotest.txt, then it quits.
set com_maxfps 60
set g_gametype 0
set bot_minplayers 0
set fraglimit 0
set timelimit 0
set g_teamAutoJoin 0
set shinobi_noForceMenu 1
set shinobi_hitnumbers 1
set shinobi_debug 1
set shinobi_autotest_done "set g_teamAutoJoin 0; set shinobi_noForceMenu 0; set shinobi_debug 0; wait 30; condump shinobi_condump.txt; wait 10; quit"
devmap mp/ffa3
wait 600
team spectator
wait 60
shinobi_autotest bot_escape bot_prison bot_interrupt bot_dodge bot_keepoff bot_defend bot_fists
wait 600
follow TestB
