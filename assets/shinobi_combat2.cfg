// JK_Shinobi combat 2 (JK_Shinobi_Combat2.bat): the experiment's rules on (bg_shinobi.h), the small
// Chunin arena, two punching bags - "Dummy" takes everything, "DummyGuard" holds its guard up.
// A real opponent: addbot alora 3 free 0
set shinobi_combat2 1
set g_gametype 0
set bot_minplayers 0
set fraglimit 0
set timelimit 0
set g_teamAutoJoin 0
set shinobi_noForceMenu 0
set shinobi_hitnumbers 1
set shinobi_dummy 1
exec shinobi_camreset.cfg
map shinobi_chunin
wait 300
addbot alora 1 free 0 Dummy
wait 60
addbot alora 1 free 0 DummyGuard
