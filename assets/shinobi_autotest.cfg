// JK_Shinobi automatic tests: "exec shinobi_autotest" from the main menu console.
// Loads a map with cheats, puts you in spectator, adds two bots (TestA, TestB)
// and runs every test (~1.5 min). Results: the console, qconsole.log and
// shinobi_autotest.txt in the shinobi folder. Watch with "follow TestA".
// One test only: "shinobi_autotest <name>" (list: "shinobi_autotest list").
set com_maxfps 60
set g_gametype 0
set bot_minplayers 0
set fraglimit 0
set timelimit 0
set g_teamAutoJoin 0
set shinobi_noForceMenu 1
set shinobi_hitnumbers 1
devmap mp/ffa3
wait 600
team spectator
wait 60
shinobi_autotest
wait 600
follow TestA
