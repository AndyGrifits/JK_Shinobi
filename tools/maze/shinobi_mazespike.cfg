// JK_Shinobi maze spike test (misc_bsp ring). Screenshots screenshots/mz*.jpg, console shinobi_mazespike.txt.
// Expected: corridors orange, rooms blue, the west corridor (control C, A's shader names) green - if it shows
// orange instead, the shader cache mixes lightmaps of blocks with the same shader names.
// Collision: C1/C2 stop in front of the pillar (y ~ -62), C3 stops at the rib (x ~ 1076), z stays ~ 24.
set com_maxfps 60
set bot_minplayers 0
set g_gametype 0
set g_teamAutoJoin 1
set shinobi_noForceMenu 1
devmap shinobi_maze_spike
wait 600
team free
wait 120
god
set cg_thirdPerson 0
set cg_draw2D 0
wait 30
setviewpos -180 0 40 0
wait 60
screenshot mz1_room_sw_east
setviewpos 330 0 40 0
wait 60
screenshot mz2_corr_s
setviewpos 1100 150 40 180
wait 60
screenshot mz3_room_se_west
setviewpos 1024 330 40 90
wait 60
screenshot mz4_corr_e
setviewpos 700 1024 40 180
wait 60
screenshot mz5_corr_n
setviewpos 0 700 40 270
wait 60
screenshot mz6_corr_w_control
setviewpos -150 1150 40 315
wait 60
screenshot mz7_room_nw_medpac
setviewpos 900 900 40 45
wait 60
screenshot mz8_room_ne
echo MZ C1 room SW pillar
setviewpos -110 100 40 270
wait 30
+forward
wait 150
-forward
wait 30
viewpos
echo MZ C2 room SE pillar (rotated 90)
setviewpos 1134 100 40 270
wait 30
+forward
wait 150
-forward
wait 30
viewpos
echo MZ C3 east corridor rib (rotated 90)
setviewpos 1024 512 40 0
wait 30
+forward
wait 150
-forward
wait 30
viewpos
set cg_draw2D 1
condump shinobi_mazespike.txt
wait 30
quit
