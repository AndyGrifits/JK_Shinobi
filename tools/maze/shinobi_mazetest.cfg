// JK_Shinobi maze auto-test (JK_Shinobi_MazeTest.bat): loads shinobi_oro_maze with layout 0, tours it with
// notarget (screenshots screenshots/mt*.jpg), then walks into the flooded hall to get spotted, runs away to
// check the search, dumps the console (shinobi_mazetest.txt: the [maze] lines) and quits (about 2 minutes).
// Layout 0 (tools/maze/layout.py, seed 4): start (0,512), lab hall (768,768), flooded hall (3840,1280),
// goal chamber (3840,3840).
set com_maxfps 60
set bot_minplayers 0
set g_gametype 0
set g_teamAutoJoin 1
set shinobi_noForceMenu 1
set shinobi_maze_layout 0
set shinobi_maze_npcs 12
set shinobi_maze_debug 1
devmap shinobi_oro_maze
wait 600
team free
wait 120
god
notarget
set cg_draw2D 0
wait 60
screenshot mt01_start
wait 1200
screenshot mt02_start_later
setviewpos 520 520 40 45
wait 90
screenshot mt03_lab_hall
setviewpos 1800 512 40 0
wait 90
screenshot mt04_corridor_east
setviewpos 3500 950 40 45
wait 90
screenshot mt05_flooded_hall
setviewpos 512 1900 40 90
wait 90
screenshot mt06_cell_block
setviewpos 3420 3840 60 0
wait 90
screenshot mt07_goal_chamber
setviewpos 3072 2900 40 90
wait 90
screenshot mt08_corridors_north
wait 600
echo MZT fight: notarget off in the flooded hall
setviewpos 3700 1150 40 45
notarget
wait 360
screenshot mt10_fight
wait 360
screenshot mt11_fight_later
echo MZT run: back to the start room
setviewpos 0 512 40 0
wait 1300
screenshot mt12_after_run
set cg_draw2D 1
condump shinobi_mazetest.txt
wait 30
quit
